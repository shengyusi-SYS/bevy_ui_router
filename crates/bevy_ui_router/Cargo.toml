[package]
name = "bevy_ui_router"
version.workspace = true
edition.workspace = true

[features]
default = ["view"]
view = ["dep:bevy_ui_router_view"]
ecs = ["view", "dep:bevy_ui_router_ecs"]
ecs-test-support = ["ecs", "bevy_ui_router_ecs/test-support"]
test-support = ["ecs-test-support"]
bsn = ["ecs", "dep:bevy_ui_router_bsn"]
platform = ["dep:bevy_ui_router_platform"]
devtools = []

[dependencies]
bevy_ui_router_core = { path = "../bevy_ui_router_core" }
bevy_ui_router_view = { path = "../bevy_ui_router_view", optional = true, default-features = false }
bevy_ui_router_ecs = { path = "../bevy_ui_router_ecs", optional = true }
bevy_ui_router_bsn = { path = "../bevy_ui_router_bsn", optional = true }
bevy_ui_router_platform = { path = "../bevy_ui_router_platform", optional = true }

[dev-dependencies]
bevy_app = { git = "https://github.com/shengyusi-SYS/bevy.git", rev = "61f78f75684e6b0bc28a13a5933f8f55ca653fa7", version = "0.19.0", default-features = false }
bevy_ecs = { git = "https://github.com/shengyusi-SYS/bevy.git", rev = "61f78f75684e6b0bc28a13a5933f8f55ca653fa7", version = "0.19.0", default-features = false }
bevy_ui = { git = "https://github.com/shengyusi-SYS/bevy.git", rev = "61f78f75684e6b0bc28a13a5933f8f55ca653fa7", version = "0.19.0", default-features = false }
syn = { version = "2", features = ["full"] }
toml = "1.1.2"
