[package]
name = "bevy_ui_router"
version.workspace = true
edition.workspace = true
autotests = false

[features]
default = ["view"]
view = ["dep:bevy_ui_router_view"]
ecs = ["view", "dep:bevy_ui_router_ecs"]
ecs-test-support = ["ecs", "bevy_ui_router_ecs/test-support"]
test-support = ["ecs-test-support"]
bsn = ["ecs", "dep:bevy_ui_router_bsn"]
platform = ["dep:bevy_ui_router_platform"]
devtools = []

[dependencies]
bevy_ui_router_core = { path = "../bevy_ui_router_core" }
bevy_ui_router_view = { path = "../bevy_ui_router_view", optional = true, default-features = false }
bevy_ui_router_ecs = { path = "../bevy_ui_router_ecs", optional = true }
bevy_ui_router_bsn = { path = "../bevy_ui_router_bsn", optional = true }
bevy_ui_router_platform = { path = "../bevy_ui_router_platform", optional = true }

[dev-dependencies]
bevy_app = { version = "0.19.1", default-features = false }
bevy_camera = { version = "0.19.1", default-features = false }
bevy_ecs = { version = "0.19.1", default-features = false }
bevy_input_focus = { version = "0.19.1", default-features = false }
bevy_picking = { version = "0.19.1", default-features = false }
bevy_ui = { version = "0.19.1", default-features = false }
serde_json = "1"
toml = "1.1.2"

[[test]]
name = "default_facade_features"
path = "tests/default_facade_features.rs"

[[test]]
name = "public_navigation_journeys"
path = "tests/public_navigation_journeys.rs"
required-features = ["ecs"]

[[test]]
name = "public_navigation_authority_audit"
path = "tests/public_navigation_authority_audit.rs"
required-features = ["test-support"]

[[test]]
name = "public_navigation_input_isolation"
path = "tests/public_navigation_input_isolation.rs"
required-features = ["test-support"]

[[test]]
name = "ecs_facade_features"
path = "tests/ecs_facade_features.rs"
required-features = ["ecs"]

[[test]]
name = "bsn_facade_features"
path = "tests/bsn_facade_features.rs"
required-features = ["bsn"]

[[test]]
name = "test_support_features"
path = "tests/test_support_features.rs"
required-features = ["test-support"]

[[test]]
name = "dependency_contract"
path = "tests/dependency_contract.rs"

[[test]]
name = "facade_consumers"
path = "tests/facade_consumers.rs"
