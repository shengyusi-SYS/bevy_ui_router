[package]
name = "bevy_ui_router"
version.workspace = true
edition.workspace = true
description = "Composable routing for Bevy applications with optional ECS and BSN integration"
repository.workspace = true
readme.workspace = true
license.workspace = true
autotests = false

[package.metadata.docs.rs]
all-features = true

[features]
default = ["view"]
view = ["dep:bevy_ui_router_view"]
ecs = ["view", "dep:bevy_ui_router_ecs"]
bsn = ["ecs", "dep:bevy_ui_router_bsn", "bevy_ui_router_ecs/bsn"]
tween = ["ecs", "bevy_ui_router_ecs/tween"]
platform = ["dep:bevy_ui_router_platform"]
desktop-back = ["platform", "bevy_ui_router_platform/desktop-back"]
android-back = ["platform", "bevy_ui_router_platform/android-back"]
devtools = []

[dependencies]
bevy_ui_router_core = { path = "../bevy_ui_router_core", version = "0.1.0" }
bevy_ui_router_view = { path = "../bevy_ui_router_view", version = "0.1.0", optional = true, default-features = false }
bevy_ui_router_ecs = { path = "../bevy_ui_router_ecs", version = "0.1.0", optional = true }
bevy_ui_router_bsn = { path = "../bevy_ui_router_bsn", version = "0.1.0", optional = true }
bevy_ui_router_platform = { path = "../bevy_ui_router_platform", version = "0.1.0", optional = true }

[dev-dependencies]
bevy_app = { version = "0.19", default-features = false }
bevy_asset = { version = "0.19", default-features = false }
bevy_camera = { version = "0.19", default-features = false }
bevy_ecs = { version = "0.19", default-features = false }
bevy_input_focus = { version = "0.19", default-features = false }
bevy_input = { version = "0.19", default-features = false, features = ["mouse", "keyboard"] }
bevy_window = { version = "0.19", default-features = false }
bevy_internal = { version = "0.19", default-features = false, features = ["bevy_window", "bevy_camera", "bevy_ui", "bevy_picking"] }
bevy_picking = { version = "0.19", default-features = false }
bevy_scene = { version = "0.19", default-features = false }
bevy_ui = { version = "0.19", default-features = false }
serde_json = "1"

[[example]]
name = "bsn_quick_start"
required-features = ["bsn"]

[[example]]
name = "bsn_nested"
required-features = ["bsn"]

[[bench]]
name = "router_baseline"
harness = false
required-features = ["bsn"]

[[bench]]
name = "bsn_content_control"
harness = false
required-features = ["bsn"]

[[test]]
name = "default_facade_features"
path = "tests/default_facade_features.rs"

[[test]]
name = "public_usage"
path = "tests/public_usage.rs"
required-features = ["bsn"]

[[test]]
name = "public_navigation_journeys"
path = "tests/public_navigation_journeys.rs"
required-features = ["bsn"]

[[test]]
name = "retained_navigation"
path = "tests/retained_navigation.rs"
required-features = ["bsn"]

[[test]]
name = "route_transitions"
path = "tests/route_transitions.rs"
required-features = ["bsn"]

[[test]]
name = "platform_back"
path = "tests/platform_back.rs"
required-features = ["bsn"]

[[test]]
name = "scroll_restoration"
path = "tests/scroll_restoration.rs"
required-features = ["bsn"]

[[test]]
name = "public_activity"
path = "tests/public_activity.rs"
required-features = ["bsn"]

[[test]]
name = "ecs_facade_features"
path = "tests/ecs_facade_features.rs"
required-features = ["ecs"]

[[test]]
name = "bsn_facade_features"
path = "tests/bsn_facade_features.rs"
required-features = ["bsn"]

[[test]]
name = "bsn_native_input"
path = "tests/bsn_native_input.rs"
required-features = ["bsn"]

[[test]]
name = "bsn_native_focus"
path = "tests/bsn_native_focus.rs"
required-features = ["bsn"]

[[test]]
name = "dependency_contract"
path = "tests/dependency_contract.rs"

[[test]]
name = "facade_consumers"
path = "tests/facade_consumers.rs"
