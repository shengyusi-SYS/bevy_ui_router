[package]
name = "bevy_ui_router_ecs"
version.workspace = true
edition.workspace = true

[features]
default = []
test-support = ["bevy_ui_router_core/test-support"]

[dependencies]
bevy_app = { version = "0.19.1", default-features = false }
bevy_camera = { version = "0.19.1", default-features = false }
bevy_color = { version = "0.19.1", default-features = false }
bevy_ecs = { version = "0.19.1", default-features = false }
bevy_input_focus = { version = "0.19.1", default-features = false }
bevy_picking = { version = "0.19.1", default-features = false }
bevy_ui = { version = "0.19.1", default-features = false, features = ["bevy_picking"] }
bevy_ui_router_core = { path = "../bevy_ui_router_core" }
bevy_ui_router_view = { path = "../bevy_ui_router_view" }

[dev-dependencies]
bevy_ui_router_core = { path = "../bevy_ui_router_core", features = ["test-support"] }
bevy_internal = { version = "0.19.1", default-features = false, features = ["bevy_window", "bevy_camera", "bevy_ui", "bevy_picking"] }
