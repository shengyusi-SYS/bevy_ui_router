[package]
name = "bevy_ui_router_ecs"
version.workspace = true
edition.workspace = true

[features]
default = []
test-support = ["bevy_ui_router_core/test-support"]

[dependencies]
bevy_app = { git = "https://github.com/shengyusi-SYS/bevy.git", rev = "61f78f75684e6b0bc28a13a5933f8f55ca653fa7", version = "0.19.0", default-features = false }
bevy_camera = { git = "https://github.com/shengyusi-SYS/bevy.git", rev = "61f78f75684e6b0bc28a13a5933f8f55ca653fa7", version = "0.19.0", default-features = false }
bevy_color = { git = "https://github.com/shengyusi-SYS/bevy.git", rev = "61f78f75684e6b0bc28a13a5933f8f55ca653fa7", version = "0.19.0", default-features = false }
bevy_ecs = { git = "https://github.com/shengyusi-SYS/bevy.git", rev = "61f78f75684e6b0bc28a13a5933f8f55ca653fa7", version = "0.19.0", default-features = false }
bevy_input_focus = { git = "https://github.com/shengyusi-SYS/bevy.git", rev = "61f78f75684e6b0bc28a13a5933f8f55ca653fa7", version = "0.19.0", default-features = false }
bevy_picking = { git = "https://github.com/shengyusi-SYS/bevy.git", rev = "61f78f75684e6b0bc28a13a5933f8f55ca653fa7", version = "0.19.0", default-features = false }
bevy_ui = { git = "https://github.com/shengyusi-SYS/bevy.git", rev = "61f78f75684e6b0bc28a13a5933f8f55ca653fa7", version = "0.19.0", default-features = false, features = ["bevy_picking"] }
bevy_ui_router_core = { path = "../bevy_ui_router_core" }
bevy_ui_router_view = { path = "../bevy_ui_router_view" }

[dev-dependencies]
bevy_ui_router_core = { path = "../bevy_ui_router_core", features = ["test-support"] }
bevy_internal = { git = "https://github.com/shengyusi-SYS/bevy.git", rev = "61f78f75684e6b0bc28a13a5933f8f55ca653fa7", version = "0.19.0", default-features = false, features = ["bevy_window", "bevy_camera", "bevy_ui", "bevy_picking"] }
syn = { version = "2", features = ["full"] }
toml = "1.1.2"
