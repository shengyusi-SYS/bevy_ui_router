[package]
name = "bevy_ui_router_platform"
version.workspace = true
edition.workspace = true
description = "Platform navigation contracts for Bevy UI Router"
repository.workspace = true
readme.workspace = true
license.workspace = true

[features]
default = []
desktop-back = ["dep:bevy_app", "dep:bevy_ecs", "dep:bevy_input", "bevy_input/mouse"]
android-back = ["dep:bevy_app", "dep:bevy_ecs", "dep:bevy_input", "bevy_input/keyboard"]

[dependencies]
bevy_ui_router_core = { path = "../bevy_ui_router_core", version = "0.1.0" }
bevy_app = { version = "0.20.1", default-features = false, optional = true }
bevy_ecs = { version = "0.20.1", default-features = false, optional = true }
bevy_input = { version = "0.20.1", default-features = false, features = ["std"], optional = true }
