name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install window example build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev
      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path examples/windowed/Cargo.toml --all --check
      # The public consumer and dependency gates resolve offline, including all targets.
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check all targets and features
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Test workspace and public consumers
        run: cargo test --workspace --all-features --locked
      - name: Verify release packages and packaged public consumer
        run: |
          cargo package --workspace
          python3 scripts/check-packaged-consumer.py
      # Resolve and build separately so graphical features do not enter headless tests.
      - name: Fetch window example dependencies
        run: cargo fetch --manifest-path examples/windowed/Cargo.toml --locked
      - name: Check window example
        run: cargo check --manifest-path examples/windowed/Cargo.toml --all-targets --locked
