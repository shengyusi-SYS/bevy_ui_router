name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/check-docs.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check-docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation links
        run: python3 scripts/check-docs.py
