[package]
name = "bevy-router-input-seam-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
bevy_app = { version = "=0.19.1", default-features = false, features = ["std"] }
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std"] }
bevy_input = { version = "=0.19.1", default-features = false, features = ["std", "keyboard"] }
bevy_input_focus = { path = "bevy_input_focus", default-features = false, features = ["std", "keyboard"] }
bevy_window = { version = "=0.19.1", default-features = false, features = ["std"] }
bevy_math = { version = "=0.19.1", default-features = false, features = ["std"] }
