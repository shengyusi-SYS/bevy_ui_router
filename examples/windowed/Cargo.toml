[package]
name = "router_windowed"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "router_windowed"

[workspace]
resolver = "3"

[features]
default = []
tween = ["bevy_ui_router/tween", "dep:bevy_tween"]
ui-debug = ["bevy_internal/bevy_remote", "bevy_internal/serialize", "bevy_internal/png", "dep:serde_json", "dep:image"]

[dependencies]
bevy_tween = { version = "0.13.0", default-features = false, optional = true }
bevy_ui_router = { path = "../../crates/bevy_ui_router", features = ["bsn", "desktop-back"] }
bevy_ecs = { version = "0.19", default-features = false }
bevy_scene = { version = "0.19", default-features = false }
bevy_input_focus = { version = "0.19", default-features = false }
bevy_internal = { version = "0.19", default-features = false, features = [
    "std", "multi_threaded", "bevy_log", "bevy_asset", "bevy_scene",
    "bevy_winit", "x11", "bevy_ui_render", "bevy_picking", "default_font",
] }

serde_json = { version = "1", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }

[[bin]]
name = "tween_transitions"
path = "src/bin/tween_transitions.rs"
required-features = ["tween"]
